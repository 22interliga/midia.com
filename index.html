<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101820"><title>Last Mile • Operação DS</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"></head><body>
<div class="app-shell"><aside class="sidebar" id="sidebar"><div class="brand"><div class="brand-mark">LM</div><div><strong>Last Mile</strong><span>Operação DS</span></div></div><nav id="nav"></nav><div class="sidebar-footer">Gestão de distribuição • v4.0</div></aside><main class="main"><header class="topbar"><button class="icon-btn mobile-only" id="menuBtn">☰</button><div><h1 id="pageTitle">Dashboard</h1><p id="pageSubtitle">Visão geral da operação</p></div><div class="top-actions"><button class="ghost-btn" id="importBtn">⇧ Importar carga</button><button class="primary-btn" id="newBtn">+ Novo Waybill</button></div></header><section class="content" id="content"></section></main></div><div class="overlay" id="overlay"></div><div class="toast" id="toast"></div>
<dialog id="wbDialog"><form id="wbForm"><div class="dialog-head"><div><h2>Novo Waybill</h2><p>Registrar volume recebido no DS.</p></div><button type="button" class="icon-btn close">✕</button></div><div class="form-grid"><label>Waybill<input name="waybill" required placeholder="WB000001"></label><label>Referência / Pedido<input name="referencia" placeholder="PED-0001"></label><label>Cliente<input name="cliente" required></label><label>Destinatário<input name="destinatario" required></label><label>Telefone<input name="telefone"></label><label>Prazo / SLA<input name="prazo" type="date" required></label><label class="span-2">Endereço de entrega<input name="endereco" required></label><label>Cidade<input name="cidade" required></label><label>Volumes<input name="volumes" type="number" min="1" value="1"></label></div><div class="dialog-actions"><button type="button" class="ghost-btn close">Cancelar</button><button class="primary-btn">Receber no DS</button></div></form></dialog>
<dialog id="occDialog"><form id="occForm"><input type="hidden" name="waybill"><div class="dialog-head"><div><h2>Registrar ocorrência</h2><p id="occWb"></p></div><button type="button" class="icon-btn close-occ">✕</button></div><div class="form-grid"><label>Tipo<select name="tipo"><option>Destinatário ausente</option><option>Endereço incorreto</option><option>Endereço não localizado</option><option>Recusa do destinatário</option><option>Estabelecimento fechado</option><option>Pacote avariado</option><option>Pacote não localizado</option><option>Área de risco</option><option>Outro</option></select></label><label>Próxima ação<select name="acao"><option>Nova tentativa</option><option>Devolução</option><option>Análise operacional</option></select></label><label class="span-2">Observação<textarea name="obs" rows="3"></textarea></label></div><div class="dialog-actions"><button type="button" class="ghost-btn close-occ">Cancelar</button><button class="primary-btn">Salvar ocorrência</button></div></form></dialog>
<input id="fileInput" type="file" accept=".csv,text/csv" hidden><script src="app.js"></script></body></html>
