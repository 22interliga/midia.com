<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#101820" />
  <title>Interliga Last Mile</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">IL</div>
        <div><strong>Interliga</strong><span>Last Mile</span></div>
      </div>
      <nav id="nav"></nav>
      <div class="sidebar-footer">Operação logística • v1.0</div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn mobile-only" id="menuBtn" aria-label="Abrir menu">☰</button>
        <div>
          <h1 id="pageTitle">Dashboard</h1>
          <p id="pageSubtitle">Visão geral da operação</p>
        </div>
        <div class="top-actions">
          <button class="ghost-btn" id="seedBtn">Restaurar demo</button>
          <button class="primary-btn" id="newOrderBtn">+ Novo pedido</button>
        </div>
      </header>
      <section class="content" id="content"></section>
    </main>
  </div>

  <div class="overlay" id="overlay"></div>
  <div class="toast" id="toast"></div>

  <dialog id="orderDialog">
    <form method="dialog" id="orderForm">
      <div class="dialog-head">
        <div><h2>Novo pedido</h2><p>Cadastre uma coleta e entrega.</p></div>
        <button type="button" class="icon-btn" id="closeDialogBtn">✕</button>
      </div>
      <div class="form-grid">
        <label>Cliente<input name="cliente" required placeholder="Empresa contratante" /></label>
        <label>Destinatário<input name="destinatario" required placeholder="Nome do destinatário" /></label>
        <label>Telefone<input name="telefone" placeholder="(71) 99999-9999" /></label>
        <label>Veículo<select name="veiculo"><option>Moto</option><option>Inter Car</option></select></label>
        <label class="span-2">Endereço de coleta<input name="coleta" required placeholder="Rua, número, bairro, cidade" /></label>
        <label class="span-2">Endereço de entrega<input name="entrega" required placeholder="Rua, número, bairro, cidade" /></label>
        <label>Volumes<input name="volumes" type="number" min="1" value="1" /></label>
        <label>Prioridade<select name="prioridade"><option>Normal</option><option>Alta</option><option>Urgente</option></select></label>
      </div>
      <div class="dialog-actions">
        <button type="button" class="ghost-btn" id="cancelDialogBtn">Cancelar</button>
        <button class="primary-btn" value="default">Salvar pedido</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
